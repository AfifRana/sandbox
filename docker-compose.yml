name: order-processing-platform

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: orders
      APP_USER_PASSWORD: orders
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - oracle-data:/opt/oracle/oradata

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USER: orders
      DB_PASSWORD: orders
      KAFKA_BROKERS: kafka:29092
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
    ports:
      - "8080:8080"

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USER: orders
      DB_PASSWORD: orders
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
    ports:
      - "8081:8080"

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    depends_on: [kafka, oracle, auth-service]
    environment:
      KAFKA_BROKERS: kafka:29092
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USER: orders
      DB_PASSWORD: orders
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
    ports:
      - "8082:8080"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on: [kafka]
    environment:
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8083:8080"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      AUTH_ISSUER: http://auth-service:8080
    ports:
      - "8084:8080"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    depends_on: [auth-service, order-service, product-service, payment-service]
    environment:
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
      AUTH_SERVICE_URI: http://auth-service:8080
      ORDER_SERVICE_URI: http://order-service:8080
      PRODUCT_SERVICE_URI: http://product-service:8080
      PAYMENT_SERVICE_URI: http://payment-service:8080
    ports:
      - "9000:8080"

volumes:
  oracle-data:
