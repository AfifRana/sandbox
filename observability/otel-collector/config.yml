# OpenTelemetry Collector for the order-processing-platform demo stack.
# Services push spans here via OTLP HTTP (:4318); the collector batches
# them and forwards to Jaeger. Keeping a collector between apps and the
# backend lets you swap Jaeger for Tempo/Zipkin without touching app code.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
