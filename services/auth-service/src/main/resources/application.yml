spring:
  application:
    name: auth-service

server:
  port: 8080

app:
  auth:
    # Demo-only: generated key pair. Real deployments load keys from a
    # KMS/vault and rotate them; JWKS supports rotation via kid header.
    issuer: ${AUTH_ISSUER:http://localhost:8084}
    access-token-ttl: ${AUTH_TOKEN_TTL:PT1H}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  tracing:
    sampling:
      probability: 1.0  # sample 100% for the demo; lower in production
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces