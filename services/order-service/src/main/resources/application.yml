spring:
  application:
    name: order-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8084/oauth2/jwks}
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: order_flyway_history
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  threads:
    virtual:
      enabled: true

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8081}

resilience4j:
  retry:
    instances:
      productCatalog:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.example.order.application.port.ProductCatalog$CatalogUnavailableException
  circuitbreaker:
    instances:
      productCatalog:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - com.example.order.application.port.ProductCatalog$CatalogUnavailableException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException.NotFound

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
