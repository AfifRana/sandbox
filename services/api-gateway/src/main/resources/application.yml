spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:8080/oauth2/jwks}
  cloud:
    gateway:
      routes:
            - id: auth
              uri: ${AUTH_SERVICE_URI:http://auth-service:8080}
              predicates:
                - Path=/auth/**,/oauth2/jwks
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://order-service:8080}
              predicates:
                - Path=/api/v1/orders/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URI:http://product-service:8080}
              predicates:
                - Path=/api/v1/products/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://payment-service:8080}
              predicates:
                - Path=/api/v1/payments/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus

  tracing:
    sampling:
      probability: 1.0  # sample 100% for the demo; lower in production
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces