# Default values for the order-platform chart.
# Deploy target: minikube (docker driver). Images are built locally with
# `docker compose build` and loaded into the cluster with
# `minikube image load <image>` — no registry push needed.

global:
  namespace: order-platform

imagePullPolicy: Never   # images come from the minikube image store

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 768Mi

# Infra (Oracle, Kafka, Redis, observability) is expected to already be
# running via docker compose on the host. Pods reach it through
# host.minikube.internal, the alias minikube's docker driver provides for
# the host (and thus the compose containers' published ports).
infra:
  oracleHost: host.minikube.internal
  oraclePort: 1521
  dbUser: orders
  dbPassword: orders
  kafkaBrokers: host.minikube.internal:9092
  redisHost: host.minikube.internal
  redisPort: 6379
  # OTLP/HTTP trace endpoint (compose-hosted otel-collector). Overrides the
  # in-cluster `otel-collector` default baked into each service's
  # application.yml via MANAGEMENT_OTLP_TRACING_ENDPOINT.
  otelCollectorHost: host.minikube.internal
  otelCollectorPort: 4318

services:
  order:
    name: order-service
    replicaCount: 2
    nodePort: 30080
  product:
    name: product-service
    replicaCount: 1
    nodePort: 30081
  payment:
    name: payment-service
    replicaCount: 1
    nodePort: 30082
  notification:
    name: notification-service
    replicaCount: 1
    nodePort: 30083
  auth:
    name: auth-service
    replicaCount: 1
    nodePort: 30084
  gateway:
    name: api-gateway
    replicaCount: 1
    nodePort: 30000

hpa:
  enabled: true
  minReplicas: 2
  # 8GB WSL node: 5 JVMs booting simultaneously starve the node (probes fail, crash loop).
  # Cap at 3 replicas and raise the target so JVM boot spikes don't trigger runaway scaling.
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: order-platform-sa
