spring:
  application:
    name: weather-watch
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/weather}
    username: ${SPRING_DATASOURCE_USERNAME:weather}
    password: ${SPRING_DATASOURCE_PASSWORD:weather-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:weather-watch}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.weatherwatch.location
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  shutdown: graceful

weather:
  kafka:
    create-topic: ${LOCATION_EVENTS_CREATE_TOPIC:true}
    location-events-topic: ${LOCATION_EVENTS_TOPIC:location-events}
    send-timeout: ${KAFKA_SEND_TIMEOUT:5s}
  open-meteo:
    base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
    connect-timeout: ${OPEN_METEO_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPEN_METEO_READ_TIMEOUT:10s}
  forecast:
    cache-ttl: ${FORECAST_CACHE_TTL:PT10M}
